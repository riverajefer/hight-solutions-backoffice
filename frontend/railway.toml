# Railway Configuration for Frontend
# This file configures how Railway builds and deploys the frontend application

[build]
builder = "RAILPACK"

[deploy]
# Servidor estático propio (frontend/server.js).
# Reemplaza a `npx serve -s dist`, que devolvía index.html con status 200 para
# los chunks inexistentes tras un despliegue y no enviaba Cache-Control.
startCommand = "node server.js"

# Health check: Railway solo pasa el tráfico al despliegue nuevo cuando `/`
# responde 200 (server.js entrega index.html). Si el servidor no arranca, la
# versión anterior sigue atendiendo.
healthcheckPath = "/"
healthcheckTimeout = 120

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
